<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Financeira Completa — Matias Valente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080814;color:#e0e0f0;font-family:"Inter",sans-serif;min-height:100vh}
#app{max-width:600px;margin:0 auto;padding:28px 20px 80px;display:none}
.logo{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#6b5fd4;text-align:center;margin-bottom:6px;font-weight:500}
.logo-linha{width:40px;height:1px;background:linear-gradient(90deg,transparent,#6b5fd4,transparent);margin:0 auto 20px}
.progress-wrap{height:2px;background:#12122a;border-radius:2px;margin-bottom:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6b5fd4,#9b8bff);border-radius:2px;transition:width .5s ease}
.progress-label{font-size:11px;color:#4a4a7a;text-align:right;margin-bottom:24px}
.card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-radius:20px;padding:28px 24px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.bloco-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7c6fd4;margin-bottom:8px;font-weight:600}
.bloco-titulo{font-size:18px;font-weight:600;color:#fff;margin-bottom:6px;line-height:1.4}
.bloco-sub{font-size:13px;color:#6060a0;margin-bottom:20px;line-height:1.6}
.pergunta{margin-bottom:20px}
.pergunta-label{font-size:13px;font-weight:500;color:#c0c0e0;margin-bottom:10px;line-height:1.5}
.pergunta-label span{color:#7c6fd4}
.hint{font-size:11px;color:#5050a0;margin-bottom:8px;display:block}
input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #1e1e3a;background:#080814;color:#e0e0f0;font-size:14px;font-family:"Inter",sans-serif;outline:none;transition:border-color .2s}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:#7c6fd4;box-shadow:0 0 0 3px rgba(124,111,212,.1)}
input.erro{border-color:#f87171}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.linha-estruturada{display:grid;gap:6px;margin-bottom:8px}
.linha-estruturada.col3{grid-template-columns:2fr 1fr 1fr}
.linha-estruturada.col4{grid-template-columns:2fr 1fr 1fr 1fr}
.linha-estruturada input{font-size:12px;padding:10px 12px}
.linha-num{font-size:10px;color:#4a4a7a;margin-bottom:4px;font-weight:600;letter-spacing:1px}
.opcoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opcoes-grid.col1{grid-template-columns:1fr}
.opcao-btn{padding:11px 14px;border-radius:10px;border:1px solid #1e1e3a;background:#080814;color:#a0a0c0;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;font-family:"Inter",sans-serif;line-height:1.4}
.opcao-btn:hover{border-color:#7c6fd4;color:#fff}
.opcao-btn.on{border-color:#7c6fd4;background:#7c6fd415;color:#c0b0ff}
.tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag-btn{padding:8px 14px;border-radius:20px;border:1px solid #1e1e3a;background:#080814;color:#a0a0c0;font-size:12px;cursor:pointer;transition:all .2s;font-family:"Inter",sans-serif}
.tag-btn:hover{border-color:#7c6fd4;color:#fff}
.tag-btn.on{border-color:#7c6fd4;background:#7c6fd415;color:#c0b0ff}
.stress-escala{display:flex;gap:6px;flex-wrap:wrap}
.stress-btn{width:40px;height:40px;border-radius:8px;border:1px solid #1e1e3a;background:#080814;color:#a0a0c0;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:"Inter",sans-serif}
.stress-btn.on{background:linear-gradient(135deg,#7c6fd4,#9b8bff);border-color:transparent;color:#fff}
.btn{display:block;width:100%;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;border:none;margin-top:16px;transition:all .2s;font-family:"Inter",sans-serif}
.btn-primary{background:linear-gradient(135deg,#7c6fd4,#9b8bff);color:#fff;box-shadow:0 4px 20px rgba(124,111,212,.4)}
.btn-primary:hover{box-shadow:0 6px 28px rgba(124,111,212,.6);transform:translateY(-1px)}
.divider{border:none;border-top:1px solid #1a1a32;margin:16px 0}
.secao-titulo{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#7c6fd4;margin-bottom:12px;font-weight:600}
.loading{text-align:center;padding:48px 20px}
.dots{display:inline-flex;gap:8px;margin-bottom:20px}
.dot{width:9px;height:9px;border-radius:50%;background:#7c6fd4;animation:pulse 1.4s infinite}
.dot:nth-child(2){animation-delay:.25s}
.dot:nth-child(3){animation-delay:.5s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.msg-card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-left:3px solid #7c6fd4;border-radius:20px;padding:20px 24px;margin-bottom:16px;opacity:0;transition:opacity 1.2s ease}
.msg-card p{font-size:14px;color:#b0b0d0;line-height:1.8}
.resultado-card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-radius:20px;padding:32px 28px;margin-bottom:16px}
.resultado-titulo{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7c6fd4;margin-bottom:10px}
.resultado-nome{font-size:24px;font-weight:600;color:#fff;margin-bottom:24px}
.diagnostico-texto{font-size:15px;line-height:1.95;color:#c8c8e8}
.diagnostico-texto p{margin-bottom:18px}
.oferta-card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-radius:20px;padding:28px 24px;margin-bottom:16px}
.btn-compra{display:block;width:100%;padding:18px;border-radius:14px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;border:none;margin-bottom:12px;transition:all .2s;font-family:"Inter",sans-serif}
.btn-n3{background:linear-gradient(135deg,#7c6fd4,#b09bff);color:#fff;box-shadow:0 4px 24px rgba(124,111,212,.45)}
.btn-wa{background:transparent;color:#34d399;border:1px solid #34d39940;font-size:13px}
.btn-skip{background:transparent;color:#3a3a5a;border:none;font-size:12px;padding:10px;display:block;width:100%;text-align:center;cursor:pointer;font-family:"Inter",sans-serif}
.rodape{font-size:11px;color:#2a2a4a;text-align:center;margin-top:24px;line-height:1.7}
.erro-msg{font-size:12px;color:#f87171;margin-top:6px;display:none}
</style>
</head>
<body>

<div id="tela-senha" style="max-width:420px;margin:80px auto;padding:20px">
  <div style="background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-radius:20px;padding:36px 28px;text-align:center">
    <div style="font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#6b5fd4;margin-bottom:6px">Matias Valente</div>
    <div style="width:40px;height:1px;background:linear-gradient(90deg,transparent,#6b5fd4,transparent);margin:0 auto 24px"></div>
    <div style="font-size:20px;font-weight:600;color:#fff;margin-bottom:8px">Análise Financeira Completa</div>
    <div style="font-size:13px;color:#6060a0;margin-bottom:28px;line-height:1.6">Digite a senha recebida por e-mail após a compra para acessar seu questionário personalizado.</div>
    <input type="password" id="campo-senha" placeholder="Digite sua senha de acesso" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid #1e1e3a;background:#080814;color:#e0e0f0;font-size:14px;font-family:Inter,sans-serif;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px">
    <div id="erro-senha" style="display:none;font-size:12px;color:#f87171;margin-bottom:12px">Senha incorreta. Verifique o e-mail recebido após a compra.</div>
    <button onclick="verificarSenha()" style="display:block;width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c6fd4,#9b8bff);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">Acessar minha análise</button>
    <div style="margin-top:20px;font-size:12px;color:#3a3a5a">Não recebeu o e-mail? Verifique o spam ou entre em contato.</div>
  </div>
</div>

<div id="app">
  <div class="logo">Matias Valente</div>
  <div class="logo-linha"></div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">Introdução</div>
  <div id="tela"></div>
</div>

<script>
var SENHA_CORRETA = 'matias2026';

function mostrarQ2Quem(val) {
  var wrap = document.getElementById('q2-quem-wrap');
  if (wrap) wrap.style.display = val.trim() ? 'block' : 'none';
}
function mostrarQ3Tipo(val) {
  var wrap = document.getElementById('q3-tipo-wrap');
  if (wrap) wrap.style.display = val.trim() ? 'block' : 'none';
}
function verificarSenha() {
  var s = document.getElementById('campo-senha').value.trim();
  if (s === SENHA_CORRETA) {
    document.getElementById('tela-senha').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    render();
  } else {
    document.getElementById('erro-senha').style.display = 'block';
    document.getElementById('campo-senha').value = '';
    document.getElementById('campo-senha').focus();
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var c = document.getElementById('campo-senha');
  if (c) c.addEventListener('keypress', function(e){ if(e.key==='Enter') verificarSenha(); });
});

var D = {
  nome:'', renda_liquida:'', renda_extra_familiar:'', renda_extra_valor:'', renda_extra_quem:'', outras_rendas:'', outras_rendas_valor:'', outras_rendas_tipo:'', renda_estavel:'',
  moradia:'', contas_consumo:'', transporte:'', alimentacao:'', saude:'', educacao:'',
  gastos_ocultos:'', gastos_ocultos_valores:'',
  dividas:[{tipo:'',total:'',parcela:''},{tipo:'',total:'',parcela:''},{tipo:'',total:'',parcela:''},{tipo:'',total:'',parcela:''},{tipo:'',total:'',parcela:''}],
  renegociacoes:[{credor:'',parcela:'',restantes:''},{credor:'',parcela:'',restantes:''},{credor:'',parcela:'',restantes:''}],
  emprestimos:[{credor:'',total:'',parcela:'',restantes:''},{credor:'',total:'',parcela:'',restantes:''},{credor:'',total:'',parcela:'',restantes:''}],
  cheque_especial:'', consignado_parcela:'', consignado_restantes:'',
  divida_mais_pesada:'', nome_negativado:'', tentou_negociar:'',
  decisao_compra:'', cartao_gestao:'', habito_poupar:'', sobra_dinheiro:'',
  sentimento_financas:'', nivel_stress:5, evento_vida:'', evita_contas:'', dinheiro_relacionamentos:'',
  dependentes:'', compartilha_despesas:'', familia_dinheiro:'',
  reserva_emergencia:'', objetivo_12meses:'', sucesso_financeiro:'', por_que_agora:'', impedimento:'',
  diagnostico:''
};

function opcaoBtn(campo, valor, label) {
  var on = D[campo] === valor ? ' on' : '';
  return '<div class="opcao-btn opcao-campo" data-campo="'+campo+'" data-valor="'+valor+'"'+on+'>' + label + '</div>';
}


var blocoAtual = 0;

function opcaoBtn(campo, valor, label) {
  var on = D[campo] === valor ? ' on' : '';
  var id = 'opcao_' + campo + '_' + valor;
  return '<div id="' + id + '" class="opcao-btn' + on + '" onclick="selecionarOpcao(\''+campo+'\',\''+valor+'\')">' + label + '</div>';
}

function selecionarOpcao(el) {
  var campo = el.getAttribute('data-campo');
  var valor = el.getAttribute('data-valor');
  if (!campo || !valor) return;
  D[campo] = valor;
  var parent = el.parentNode;
  var todos = parent.querySelectorAll('.opcao-btn');
  for (var i=0; i<todos.length; i++) todos[i].classList.remove('on');
  el.classList.add('on');
  if (campo === 'cheque_especial') {
    var wrap = document.getElementById('cheque-valor-wrap');
    if (wrap) wrap.style.display = (valor !== 'NaoUso') ? 'block' : 'none';
  }
}

function aplicarListeners() {
  document.querySelectorAll('.opcao-btn.opcao-campo').forEach(function(el) {
    el.addEventListener('click', function() { selecionarOpcao(this); });
  });
}


function toggleOpcaoData(el) {
  var campo = el.dataset.campo;
  var valor = el.dataset.val;
  var parent = el.parentNode;
  var btns = parent.querySelectorAll('.opcao-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  el.classList.add('on');
  D[campo] = valor;
}



function setProg(pct, label) {
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog-label').textContent = label;
}

function getVal(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function toggleOpcao(el, campo, valor) {
  var parent = el.parentNode;
  var btns = parent.querySelectorAll('.opcao-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  el.classList.add('on');
  D[campo] = valor;
}

function toggleGasto(el, key, label) {
  el.classList.toggle('on');
  var campo = document.getElementById('gasto_val_' + key);
  if (el.classList.contains('on')) {
    if (campo) campo.style.display = 'block';
    if (!D.gastos_ocultos_map) D.gastos_ocultos_map = {};
    D.gastos_ocultos_map[key] = D.gastos_ocultos_map[key] || '';
  } else {
    if (campo) campo.style.display = 'none';
    if (D.gastos_ocultos_map) delete D.gastos_ocultos_map[key];
  }
  // Atualizar string de gastos_ocultos para o prompt
  atualizarStringGastos();
}

function atualizarGasto(key, valor) {
  if (!D.gastos_ocultos_map) D.gastos_ocultos_map = {};
  D.gastos_ocultos_map[key] = valor;
  atualizarStringGastos();
}

function atualizarStringGastos() {
  if (!D.gastos_ocultos_map) return;
  var partes = [];
  var labels = {
    delivery:'Delivery', streaming:'Streaming', celular:'Internet e celular',
    manutcasa:'Manutenção da casa', manutcarro:'Manutenção do carro',
    farmacia:'Farmácia', academia:'Academia', pet:'Pet', lazer:'Lazer'
  };
  for (var k in D.gastos_ocultos_map) {
    var v = D.gastos_ocultos_map[k];
    partes.push((labels[k] || k) + (v ? ': R$' + v : ''));
  }
  D.gastos_ocultos = partes.join(', ');
  D.gastos_ocultos_valores = partes.join(', ');
}

function toggleTagData(el) {
  var campo = el.dataset.campo;
  toggleTag(el, campo);
  // Mostrar campo de valor quando marcar gastos ocultos
  if (campo === 'gastos_ocultos') {
    var wrap = document.getElementById('gastos-val-wrap');
    if (wrap) wrap.style.display = D.gastos_ocultos ? 'block' : 'none';
  }
}

function toggleTag(el, campo) {
  el.classList.toggle('on');
  var parent = el.parentNode;
  var tags = parent.querySelectorAll('.tag-btn.on');
  var vals = [];
  for (var i = 0; i < tags.length; i++) vals.push(tags[i].dataset.val);
  D[campo] = vals.join(', ');
}

function setStress(val) {
  D.nivel_stress = val;
  document.querySelectorAll('.stress-btn').forEach(function(b){
    b.classList.toggle('on', parseInt(b.dataset.val) === val);
  });
}

function mostrarErro(msg) {
  var el = document.getElementById('erro-bloco');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
  window.scrollTo(0, document.body.scrollHeight);
}

function esconderErro() {
  var el = document.getElementById('erro-bloco');
  if (el) el.style.display = 'none';
}

function avancar() { blocoAtual++; render(); window.scrollTo(0,0); }

function render() {
  var tela = document.getElementById('tela');
  tela.innerHTML = '';

  if (blocoAtual === 0) {
    setProg(0, 'Introdução');
    tela.innerHTML = '<div class="card"><div class="bloco-label">Análise Completa N2</div><div class="bloco-titulo">Sua análise aprofundada começa aqui</div><div class="bloco-sub" style="margin-top:12px">Você adquiriu acesso à análise financeira completa do Matias Valente.<br><br>Este questionário vai mapear sua situação com precisão — receitas reais, despesas detalhadas, dívidas, comportamento financeiro e o que está por trás do padrão que se repete.<br><br>São 7 blocos de perguntas. Leva cerca de 10 minutos. Quanto mais detalhado você for, mais precisa e útil será sua análise.<br><br><strong style="color:#9b8bff">Todas as perguntas marcadas são obrigatórias.</strong> Tudo é confidencial e anônimo.</div><button class="btn btn-primary" onclick="avancar()">Começar minha análise completa</button></div>';
    aplicarListeners();
    return;
  }

  if (blocoAtual === 1) {
    setProg(14, 'Bloco 1 de 7 — Renda');
    tela.innerHTML = '<div class="card"><div class="bloco-label">Bloco 1 de 7</div><div class="bloco-titulo">Renda e receitas</div><div class="bloco-sub">Vamos entender tudo que entra todo mês.</div>' +
      '<div class="pergunta"><div class="pergunta-label"><span>1.</span> Qual é a sua renda mensal líquida? <span class="hint">Valor que cai na conta após descontos — salário, aposentadoria, pensão, etc.</span></div><input type="text" id="q1" placeholder="Ex: R$ 3.500" value="'+D.renda_liquida+'"></div>' +
      '<div class="pergunta"><div class="pergunta-label"><span>2.</span> Alguém na família contribui com a renda da casa? <span class="hint">Se sim, informe o valor mensal. Se não, deixe em branco.</span></div>' +
      '<input type="text" id="q2_valor" placeholder="Valor aproximado: R$" style="margin-bottom:8px" value="'+D.renda_extra_valor+'" oninput="mostrarQ2Quem(this.value)">' +
      '<div id="q2-quem-wrap" style="'+(D.renda_extra_valor?'':'display:none')+'">' +
      '<input type="text" id="q2_quem" placeholder="Quem contribui? Ex: Cônjuge, filho adulto, aluguel..." value="'+D.renda_extra_quem+'"></div></div>' +
      '<div class="pergunta"><div class="pergunta-label"><span>3.</span> Você tem outras fontes de renda além da principal? <span class="hint">Se sim, informe o valor total aproximado. Se não, deixe em branco.</span></div>' +
      '<input type="text" id="q3_valor" placeholder="Valor aproximado: R$" style="margin-bottom:8px" value="'+D.outras_rendas_valor+'" oninput="mostrarQ3Tipo(this.value)">' +
      '<div id="q3-tipo-wrap" style="'+(D.outras_rendas_valor?'':'display:none')+'">' +
      '<input type="text" id="q3_tipo" placeholder="Proveniente de quê? Ex: aluguel, freela, investimentos..." value="'+D.outras_rendas_tipo+'"></div></div>' +
      '<div class="pergunta"><div class="pergunta-label"><span>4.</span> Sua renda é estável ou varia todo mês?</div><div class="opcoes-grid col1">' + opcaoBtn('renda_estavel','Estavel','Estável — recebo praticamente o mesmo todo mês') + opcaoBtn('renda_estavel','Varia','Varia — há meses melhores e piores') + opcaoBtn('renda_estavel','Instavel','Muito instável — não consigo prever') + '</div></div>' +
      '<div id="erro-bloco" class="erro-msg"></div>' +
      '<button class="btn btn-primary" onclick="salvarBloco1()">Continuar</button></div>';
    aplicarListeners();
    return;
  }

  if (blocoAtual === 2) {
    setProg(28, 'Bloco 2 de 7 — Despesas');
    var tagsOcultos = [
      {key:'delivery', label:'Delivery e alimentação fora'},
      {key:'streaming', label:'Streaming (Netflix, Spotify…)'},
      {key:'celular', label:'Internet e celular'},
      {key:'manutcasa', label:'Manutenção da casa (diarista, reparos)'},
      {key:'manutcarro', label:'Manutenção do carro (seguro, IPVA, revisão)'},
      {key:'farmacia', label:'Farmácia e medicamentos contínuos'},
      {key:'academia', label:'Academia ou assinaturas'},
      {key:'pet', label:'Pet (ração, veterinário)'},
      {key:'lazer', label:'Lazer e passeios'}
    ];
    if (!D.gastos_ocultos_map) D.gastos_ocultos_map = {};
    var htmlTags = tagsOcultos.map(function(t){
      var on = D.gastos_ocultos_map[t.key] ? ' on' : '';
      var val = D.gastos_ocultos_map[t.key] || '';
      var display = on ? 'block' : 'none';
      return '<div style="margin-bottom:10px">' +
        '<div class="tag-btn'+on+'" data-key="'+t.key+'" onclick="toggleGasto(this,\''+t.key+'\',\''+t.label+'\')">'+t.label+'</div>' +
        '<input type="text" id="gasto_val_'+t.key+'" placeholder="Valor aproximado: R$" style="display:'+display+';margin-top:6px;width:200px;padding:8px 12px;border-radius:8px;border:1px solid #7c6fd4;background:#080814;color:#e0e0f0;font-size:12px;font-family:Inter,sans-serif" value="'+val+'" onchange="atualizarGasto(\''+t.key+'\',this.value)">' +
        '</div>';

function salvarBloco1() {
  esconderErro();
  D.renda_liquida = getVal('q1');
  if (!D.renda_liquida) { mostrarErro('Por favor informe sua renda mensal líquida.'); return; }
  if (!D.renda_estavel) { mostrarErro('Por favor selecione a estabilidade da sua renda.'); return; }
  D.renda_extra_valor = getVal('q2_valor');
  D.renda_extra_quem = getVal('q2_quem');
  D.renda_extra_familiar = D.renda_extra_valor ? 'R$'+D.renda_extra_valor+(D.renda_extra_quem?' ('+D.renda_extra_quem+')':'') : '';
  D.outras_rendas_valor = getVal('q3_valor');
  D.outras_rendas_tipo = getVal('q3_tipo');
  D.outras_rendas = D.outras_rendas_valor ? 'R$'+D.outras_rendas_valor+(D.outras_rendas_tipo?' ('+D.outras_rendas_tipo+')':'') : '';
  avancar();
}

function salvarBloco2() {
  esconderErro();
  D.moradia = getVal('q5');
  D.contas_consumo = getVal('q6');
  D.transporte = getVal('q7');
  D.alimentacao = getVal('q8');
  D.saude = getVal('q9');
  D.educacao = getVal('q10');
  D.gastos_ocultos_valores = getVal('q11b');
  if (!D.moradia) { mostrarErro('Por favor informe o valor de moradia. Se não tiver custo, escreva 0.'); return; }
  if (!D.alimentacao) { mostrarErro('Por favor informe o valor gasto com alimentação.'); return; }
  avancar();
}

var numDividas = 1;
var numRenegs = 1;
var numEmps = 1;

function adicionarDivida() {
  if (numDividas >= 5) return;
  var wrap = document.getElementById('dividas-wrap');
  if (wrap) {
    var div = document.createElement('div');
    div.innerHTML = gerarLinhaDivida(numDividas);
    wrap.appendChild(div.firstChild);
    while (D.dividas.length <= numDividas) D.dividas.push({tipo:'',total:'',parcela:''});
    numDividas++;
  }
}

function adicionarReneg() {
  if (numRenegs >= 5) return;
  var wrap = document.getElementById('reneg-wrap');
  if (wrap) {
    var div = document.createElement('div');
    div.innerHTML = gerarLinhaReneg(numRenegs);
    wrap.appendChild(div.firstChild);
    while (D.renegociacoes.length <= numRenegs) D.renegociacoes.push({credor:'',parcela:'',restantes:''});
    numRenegs++;
