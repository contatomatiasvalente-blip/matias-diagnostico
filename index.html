<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Financeira — Matias Valente</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:0}
#app{max-width:580px;margin:0 auto;padding:32px 20px 60px}
.logo{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8b7cf6;text-align:center;margin-bottom:8px}
.progress-wrap{height:3px;background:#1e1e35;border-radius:2px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:#8b7cf6;border-radius:2px;transition:width .4s ease}
.card{background:#14142a;border:1px solid #2a2a4a;border-radius:16px;padding:28px 24px;margin-bottom:16px}
.step-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6060a0;margin-bottom:10px}
.step-title{font-size:19px;font-weight:500;color:#fff;margin-bottom:6px;line-height:1.4}
.step-sub{font-size:13px;color:#8080b0;margin-bottom:18px;line-height:1.6}
.btn{display:block;width:100%;padding:15px 20px;border-radius:10px;font-size:14px;font-weight:500;text-align:center;cursor:pointer;border:none;margin-bottom:10px;transition:opacity .2s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:#8b7cf6;color:#fff}
.btn-primary:hover{background:#7a6be0}
.btn-outline{background:transparent;color:#8b7cf6;border:1px solid #8b7cf6}
.btn-outline:hover{background:#8b7cf620}
.btn-green{background:transparent;color:#4ade80;border:1px solid #4ade80;font-size:13px}
.btn-muted{background:transparent;color:#6060a0;border:1px solid #2a2a4a;font-size:13px}
.opcao{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #1e1e35;cursor:pointer;transition:opacity .15s}
.opcao:last-child{border-bottom:none}
.opcao:hover{opacity:.8}
.check{width:22px;height:22px;border-radius:50%;border:1px solid #3a3a6a;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.on{background:#8b7cf6;border-color:#8b7cf6}
.check.on::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.opcao-txt{font-size:14px;color:#d0d0f0;line-height:1.5}
.loading{text-align:center;padding:40px 20px}
.dots{display:inline-flex;gap:7px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;background:#8b7cf6;animation:pulse 1.3s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.diagnostico{font-size:15px;line-height:1.85;color:#d8d8f0;white-space:pre-wrap}
.divider{border:none;border-top:1px solid #2a2a4a;margin:20px 0}
.oferta-titulo{font-size:16px;font-weight:500;color:#fff;margin-bottom:6px}
.oferta-desc{font-size:13px;color:#8080b0;margin-bottom:16px;line-height:1.6}
.oferta-bloco{margin-bottom:16px}
.oferta-bloco-titulo{font-size:13px;font-weight:500;color:#c0c0e0;margin-bottom:8px}
.check-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#9090c0;margin-bottom:6px}
.check-item::before{content:'✓';color:#4ade80;flex-shrink:0;font-weight:600}
.rodape{font-size:11px;color:#404060;text-align:center;margin-top:20px}
input[type=text]{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #2a2a4a;background:#0f0f1a;color:#e0e0f0;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none}
input[type=text]:focus{border-color:#8b7cf6}
</style>
</head>
<body>
<div id="app">
  <div class="logo">Matias Valente</div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="tela"></div>
</div>

<script>
const KEY = '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';

const S = {
  etapa: 0,
  nome: '', renda: '', situacao: '', total: '',
  percentual: '', tipos: [], emocional: [], preocupacao: '',
  diagnostico: ''
};

const perguntas = [
  { id:'nome', tipo:'texto', label:'Boas-vindas', titulo:'Como posso te chamar?', sub:'Pode ser nome, apelido ou deixar em branco. Opcional.', prog:10 },
  { id:'renda', tipo:'unica', label:'Pergunta 1 de 7', titulo:'Qual é sua renda mensal aproximada?', opcoes:['Abaixo de R$2.000','R$2.000 a R$4.000','R$4.000 a R$7.000','R$7.000 a R$10.000','R$10.000 a R$15.000','Acima de R$15.000'], prog:25 },
  { id:'situacao', tipo:'unica', label:'Pergunta 2 de 7', titulo:'Como está sua situação com dívidas em atraso?', opcoes:['Várias dívidas em atraso','Nome sujo, mas já parei de atrasar','Sem atraso, mas no limite todo mês','Sem atraso e com alguma folga'], prog:38 },
  { id:'total', tipo:'unica', label:'Pergunta 3 de 7', titulo:'Quanto você estima dever no total?', opcoes:['Devo até R$2.000','R$2.000 a R$10.000','R$10.000 a R$20.000','R$20.000 a R$30.000','Acima de R$30.000'], prog:51 },
  { id:'percentual', tipo:'unica', label:'Pergunta 4 de 7', titulo:'Quanto do seu salário já está comprometido com parcelas todo mês?', opcoes:['Menos de 15%','Entre 15% e 30%','Entre 30% e 50%','Entre 50% e 70%','Mais de 70%','Não sei calcular'], prog:64 },
  { id:'tipos', tipo:'multipla', label:'Pergunta 5 de 7', titulo:'Quais desses você tem em atraso ou pesando no orçamento hoje?', sub:'Pode marcar mais de uma.', opcoes:['Contas de consumo','Cartão de crédito','Cheque especial','Empréstimo pessoal (banco ou financeira)','Empréstimo com agiota ou pessoa física','Financiamento de veículo','Financiamento de imóvel','Aluguel','Mensalidade escolar ou faculdade','Nenhuma dessas — outra situação'], prog:77 },
  { id:'emocional', tipo:'multipla', label:'Pergunta 6 de 7', titulo:'Qual dessas frases mais parece com a sua situação hoje?', sub:'Pode marcar mais de uma.', opcoes:['Trabalho muito e nunca sobra nada','Vivo apagando incêndios financeiros todo mês','O cartão de crédito virou um problema','Tenho medo de olhar minhas contas','Não sei por onde começar','Sinto que nunca vou conseguir sair disso'], prog:88 },
  { id:'preocupacao', tipo:'multipla', label:'Pergunta 7 de 7', titulo:'O que mais te preocupa hoje?', sub:'Pode marcar mais de uma.', opcoes:['Limpar o nome','Parar de receber cobranças','Não conseguir pagar tudo que precisa','Não poder ajudar minha família','Nunca conseguir sair dessa situação de vez','Ter paz e não pensar mais nisso'], prog:95 }
];

let sel = [];

function prog(p){ document.getElementById('prog').style.width = p+'%'; }

function render(){
  const tela = document.getElementById('tela');
  const i = S.etapa;

  if(i === 0){
    prog(5);
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">Análise gratuita</div>
        <div class="step-title">Olá! Sou o assistente do Matias Valente.</div>
        <div class="step-sub" style="margin-top:12px">Vou fazer uma análise gratuita da sua situação financeira, cruzando seus dados com padrões identificados em milhares de situações reais.<br><br>Você não precisa se identificar. Leva menos de 2 minutos.</div>
        <button class="btn btn-primary" onclick="av()">✅ Sim, quero minha análise</button>
      </div>
      <p class="rodape">Seus dados não são armazenados.</p>`;
    return;
  }

  const p = perguntas[i-1];
  if(!p) return;
  prog(p.prog);
  sel = Array.isArray(S[p.id]) ? [...S[p.id]] : [];

  if(p.tipo === 'texto'){
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        <input type="text" id="inp" placeholder="Digite aqui ou deixe em branco" value="${S[p.id]||''}">
        <button class="btn btn-primary" onclick="salvarTexto()">Continuar</button>
      </div>`;
    setTimeout(()=>{ const el=document.getElementById('inp'); if(el) el.focus(); },100);
    return;
  }

  if(p.tipo === 'unica'){
    const its = p.opcoes.map(op=>`
      <div class="opcao" onclick="escolherUnica('${p.id}','${op}')">
        <div class="check ${S[p.id]===op?'on':''}"></div>
        <span class="opcao-txt">${op}</span>
      </div>`).join('');
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        ${its}
      </div>`;
    return;
  }

  if(p.tipo === 'multipla'){
    const its = p.opcoes.map((op,idx)=>`
      <div class="opcao" onclick="toggleSel('${op}',${idx})">
        <div class="check ${sel.includes(op)?'on':''}" id="ck${idx}"></div>
        <span class="opcao-txt">${op}</span>
      </div>`).join('');
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        ${its}
        <button class="btn btn-primary" style="margin-top:16px" onclick="confirmarSel('${p.id}')">Confirmar</button>
      </div>`;
    return;
  }
}

function av(){ S.etapa++; render(); }

function salvarTexto(){
  const v = document.getElementById('inp').value.trim();
  S[perguntas[S.etapa-1].id] = v;
  av();
}

function escolherUnica(id, val){
  S[id] = val;
  av();
}

function toggleSel(val, idx){
  const ck = document.getElementById('ck'+idx);
  if(sel.includes(val)){
    sel = sel.filter(v=>v!==val);
    ck.classList.remove('on');
  } else {
    sel.push(val);
    ck.classList.add('on');
  }
}

function confirmarSel(id){
  if(sel.length===0){ alert('Selecione ao menos uma opção.'); return; }
  S[id] = [...sel];
  if(S.etapa >= perguntas.length){ gerar(); } else { av(); }
}

async function gerar(){
  prog(98);
  document.getElementById('tela').innerHTML = `
    <div class="card loading">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <p style="font-size:15px;font-weight:500;color:#fff;margin-bottom:8px">Cruzando suas respostas...</p>
      <p style="font-size:13px;color:#8080b0">Sua análise está sendo preparada. Isso leva alguns instantes.</p>
    </div>`;

  const prompt = `Você é o assistente do Matias Valente. Gere um diagnóstico financeiro empático seguindo essa sequência obrigatória:

1) Identificação emocional — espelhe o sentimento com linguagem humana e empática (2-3 linhas)
2) Arquétipo — revele o nome (Trabalhador Exausto, Apagador de Incêndios, Parcelador, Sobrevivente, Quase Organizado ou Cuidador) e explique em 2 frases por que esse perfil se encaixa
3) Nível de risco de 1 a 5 com legenda positiva — nunca de condenação
4) O que mais pesa — cite as dívidas e comprometimentos reais informados
5) Primeiro passo concreto e gratuito realizável hoje
6) Mini Revelação — abra uma lacuna psicológica sem revelar o padrão completo (máximo 4 linhas)
7) Transição para oferta — sem mencionar preço

Assine como Matias Valente. Escreva de forma direta, empática e humanizada. Sem bullets excessivos.

DADOS:
${S.nome ? 'Nome: '+S.nome : ''}
Renda: ${S.renda}
Situação: ${S.situacao}
Total devido: ${S.total}
% comprometida: ${S.percentual}
Tipos de dívida: ${Array.isArray(S.tipos)?S.tipos.join(', '):S.tipos}
Identificação emocional: ${Array.isArray(S.emocional)?S.emocional.join(', '):S.emocional}
Maior preocupação: ${Array.isArray(S.preocupacao)?S.preocupacao.join(', '):S.preocupacao}`;

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,messages:[{role:'user',content:prompt}]})
    });
    const d = await r.json();
    S.diagnostico = d.content?.[0]?.text || 'Não foi possível gerar o diagnóstico.';
    exibir();
  } catch(e){
    document.getElementById('tela').innerHTML = `<div class="card"><p style="color:#f87171;margin-bottom:16px">Erro ao gerar diagnóstico.</p><button class="btn btn-primary" onclick="gerar()">Tentar novamente</button></div>`;
  }
}

function exibir(){
  prog(100);
  const saud = S.nome ? S.nome+', sua análise está pronta' : 'Sua análise está pronta';
  document.getElementById('tela').innerHTML = `
    <div class="card">
      <div class="step-label">Análise exclusiva</div>
      <div class="step-title">${saud}</div>
      <div style="margin-top:16px" class="diagnostico">${S.diagnostico}</div>
    </div>

    <div class="card">
      <div class="oferta-titulo">Existem dois caminhos a partir daqui</div>
      <div class="oferta-desc">A diferença não é o tamanho — é a dor que cada um resolve.</div>

      <div class="oferta-bloco">
        <div class="oferta-bloco-titulo">Opção 1 — O caminho para sair</div>
        <div class="check-item">Valor real de cada dívida, não faixas</div>
        <div class="check-item">Ordem exata de qual atacar primeiro</div>
        <div class="check-item">Estimativa de tempo com sua renda real</div>
        <div class="check-item">Uma ação imediata específica para o seu caso</div>
      </div>

      <div class="divider"></div>

      <div class="oferta-bloco">
        <div class="oferta-bloco-titulo">Opção 2 — Por que esse caminho se repetiu</div>
        <div class="check-item">Tudo da Opção 1</div>
        <div class="check-item">O padrão que mantém a situação se repetindo</div>
        <div class="check-item">3 mudanças específicas para o seu perfil</div>
        <div class="check-item">Guia prático + mensagem final personalizada</div>
      </div>

      <button class="btn btn-primary" onclick="window.open('https://pay.kiwify.com.br/7A0vh4P','_blank')">Quero entender o caminho para sair</button>
      <button class="btn btn-outline" onclick="window.open('https://kiwify.app/sTU8H60','_blank')">Quero entender por que se repetiu</button>
      <button class="btn btn-green" onclick="salvarWA()">📱 Salvar análise no WhatsApp</button>
      <button class="btn btn-muted" onclick="fechar()">Agora não</button>
    </div>

    <p class="rodape">Seus dados não são armazenados. Análise gerada de forma anônima.</p>`;
}

function salvarWA(){
  window.open('https://wa.me/?text='+encodeURIComponent('Minha análise — Matias Valente:\n\n'+S.diagnostico),'_blank');
}

function fechar(){
  const cards = document.querySelectorAll('.card');
  const last = cards[cards.length-1];
  last.innerHTML = `
    <p style="font-size:15px;font-weight:500;color:#fff;margin-bottom:8px">Tudo bem — a análise fica aqui quando você estiver pronto.</p>
    <p style="font-size:13px;color:#8080b0;line-height:1.6">O canal do Matias Valente continua te ajudando de graça. Toda semana tem vídeo novo sobre exatamente o que você está passando.</p>
    <p style="font-size:13px;color:#8b7cf6;margin-top:12px">— Matias Valente</p>`;
}

render();
</script>
</body>
</html>
