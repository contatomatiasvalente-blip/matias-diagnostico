<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Financeira — Matias Valente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080814;color:#e0e0f0;font-family:'Inter',sans-serif;min-height:100vh;padding:0}
#app{max-width:560px;margin:0 auto;padding:28px 20px 80px}
.logo{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#6b5fd4;text-align:center;margin-bottom:6px;font-weight:500}
.logo-linha{width:40px;height:1px;background:linear-gradient(90deg,transparent,#6b5fd4,transparent);margin:0 auto 24px}
.progress-wrap{height:2px;background:#12122a;border-radius:2px;margin-bottom:32px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6b5fd4,#9b8bff);border-radius:2px;transition:width .5s ease}
.card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-radius:20px;padding:32px 28px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.step-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#4a4a7a;margin-bottom:12px;font-weight:500}
.step-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:8px;line-height:1.4}
.step-sub{font-size:14px;color:#7070a0;margin-bottom:22px;line-height:1.7}
.btn{display:block;width:100%;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;border:none;margin-bottom:10px;transition:all .2s;font-family:'Inter',sans-serif}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#7c6fd4,#9b8bff);color:#fff;box-shadow:0 4px 20px rgba(124,111,212,.4)}
.btn-primary:hover{box-shadow:0 6px 28px rgba(124,111,212,.6);transform:translateY(-1px)}
.btn-green{background:transparent;color:#34d399;border:1px solid #34d39940;font-size:13px}
.btn-green:hover{background:#34d39910}
.btn-muted{background:transparent;color:#3a3a5a;border:none;font-size:12px;padding:10px;margin-top:4px;display:block;width:100%;text-align:center;cursor:pointer;font-family:'Inter',sans-serif}
.btn-muted:hover{color:#6060a0}
.opcao{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid #12122a;cursor:pointer;transition:all .15s}
.opcao:last-child{border-bottom:none}
.opcao:hover .opcao-txt{color:#fff}
.opcao:hover .check{border-color:#6b5fd4}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid #2a2a4a;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check.on{background:linear-gradient(135deg,#7c6fd4,#9b8bff);border-color:transparent;box-shadow:0 0 12px rgba(124,111,212,.4)}
.check.on::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.opcao-txt{font-size:14px;color:#a0a0c0;line-height:1.5;transition:color .15s}
.loading{text-align:center;padding:44px 20px}
.dots{display:inline-flex;gap:8px;margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#7c6fd4;animation:pulse 1.4s infinite}
.dot:nth-child(2){animation-delay:.25s}
.dot:nth-child(3){animation-delay:.5s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.msg-card{background:linear-gradient(145deg,#0e0e22,#111128);border:1px solid #1e1e3a;border-left:3px solid #7c6fd4;border-radius:20px;padding:22px 26px;margin-bottom:16px;opacity:0;transition:opacity 1.2s ease;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.msg-card p{font-size:14px;color:#b0b0d0;line-height:1.8}
.diagnostico{font-size:15px;line-height:1.95;color:#c8c8e8}
.diagnostico p{margin-bottom:18px}
.diagnostico p:last-child{margin-bottom:0}
.oferta-header{margin-bottom:24px}
.oferta-titulo{font-size:20px;font-weight:700;color:#fff;margin-bottom:12px;line-height:1.3}
.oferta-desc{font-size:14px;color:#7070a0;line-height:1.8}
.oferta-credencial{font-size:13px;color:#9b8bff;font-style:italic;margin-top:10px;padding:12px 16px;background:#9b8bff10;border-radius:10px;border-left:2px solid #9b8bff40}
.opcao-card{background:#080814;border:1px solid #1e1e3a;border-radius:14px;padding:20px;margin-bottom:12px}
.opcao-card.destaque{border-color:#7c6fd430;background:linear-gradient(145deg,#0a0a1e,#0f0f28);box-shadow:0 0 30px rgba(124,111,212,.08)}
.opcao-card-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#9b8bff;background:#9b8bff15;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.opcao-card-titulo{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.opcao-card-sub{font-size:12px;color:#6060a0;margin-bottom:14px;font-style:italic}
.check-item{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#9090b8;margin-bottom:8px;line-height:1.5}
.check-icon{color:#34d399;flex-shrink:0;font-weight:700;margin-top:1px;font-size:12px}
.bonus-bloco{border-top:1px solid #1e1e3a;margin-top:16px;padding-top:16px}
.bonus-titulo{font-size:11px;font-weight:700;color:#9b8bff;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.btn-compra{display:block;width:100%;padding:18px 24px;border-radius:14px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;border:none;margin-bottom:12px;transition:all .2s;font-family:'Inter',sans-serif}
.btn-compra:active{transform:scale(.98)}
.btn-compra-1{background:linear-gradient(135deg,#5a4fbf,#7c6fd4);color:#fff;box-shadow:0 4px 20px rgba(90,79,191,.35)}
.btn-compra-1:hover{box-shadow:0 8px 32px rgba(90,79,191,.5);transform:translateY(-2px)}
.btn-compra-2{background:linear-gradient(135deg,#7c6fd4,#b09bff);color:#fff;box-shadow:0 4px 24px rgba(124,111,212,.45)}
.btn-compra-2:hover{box-shadow:0 8px 36px rgba(124,111,212,.6);transform:translateY(-2px)}
.anonimo{font-size:11px;color:#3a3a5a;text-align:center;margin:8px 0 16px;letter-spacing:.5px}
.rodape{font-size:11px;color:#2a2a4a;text-align:center;margin-top:24px;line-height:1.7}
input[type=text]{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #1e1e3a;background:#080814;color:#e0e0f0;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:12px;outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:#7c6fd4;box-shadow:0 0 0 3px rgba(124,111,212,.1)}
</style>
</head>
<body>
<div id="app">
  <div class="logo">Matias Valente</div>
  <div class="logo-linha"></div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="tela"></div>
</div>
<script>
var S={etapa:0,nome:'',renda:'',situacao:'',total:'',percentual:'',tipos:[],emocional:[],preocupacao:[],diagnostico:''};
var perguntas=[
  {id:'nome',tipo:'texto',label:'Boas-vindas',titulo:'Como posso te chamar?',sub:'Pode ser nome, apelido ou deixar em branco. Opcional.',prog:10},
  {id:'renda',tipo:'unica',label:'Pergunta 1 de 7',titulo:'Qual é sua renda mensal aproximada?',opcoes:['Abaixo de R$2.000','R$2.000 a R$4.000','R$4.000 a R$7.000','R$7.000 a R$10.000','R$10.000 a R$15.000','Acima de R$15.000'],prog:25},
  {id:'situacao',tipo:'unica',label:'Pergunta 2 de 7',titulo:'Como está sua situação com dívidas em atraso?',opcoes:['Várias dívidas em atraso','Nome sujo, mas já parei de atrasar','Sem atraso, mas no limite todo mês','Sem atraso e com alguma folga'],prog:38},
  {id:'total',tipo:'unica',label:'Pergunta 3 de 7',titulo:'Quanto você estima dever no total?',opcoes:['Devo até R$2.000','R$2.000 a R$10.000','R$10.000 a R$20.000','R$20.000 a R$30.000','Acima de R$30.000'],prog:51},
  {id:'percentual',tipo:'unica',label:'Pergunta 4 de 7',titulo:'Quanto do seu salário já está comprometido com parcelas todo mês?',opcoes:['Menos de 15%','Entre 15% e 30%','Entre 30% e 50%','Entre 50% e 70%','Mais de 70%','Não sei calcular'],prog:64},
  {id:'tipos',tipo:'multipla',label:'Pergunta 5 de 7',titulo:'Quais desses você tem em atraso ou pesando no orçamento hoje?',sub:'Pode marcar mais de uma.',opcoes:['Contas de consumo','Cartão de crédito','Cheque especial','Empréstimo pessoal (banco ou financeira)','Empréstimo com agiota ou pessoa física','Financiamento de veículo','Financiamento de imóvel','Aluguel','Mensalidade escolar ou faculdade','Nenhuma dessas — outra situação'],prog:77},
  {id:'emocional',tipo:'multipla',label:'Pergunta 6 de 7',titulo:'Qual dessas frases mais parece com a sua situação hoje?',sub:'Pode marcar mais de uma.',opcoes:['Trabalho muito e nunca sobra nada','Vivo apagando incêndios financeiros todo mês','O cartão de crédito virou um problema','Tenho medo de olhar minhas contas','Não sei por onde começar','Sinto que nunca vou conseguir sair disso'],prog:88},
  {id:'preocupacao',tipo:'multipla',label:'Pergunta 7 de 7',titulo:'O que mais te preocupa hoje?',sub:'Pode marcar mais de uma.',opcoes:['Limpar o nome','Parar de receber cobranças','Não conseguir pagar tudo que precisa','Não poder ajudar minha família','Nunca conseguir sair dessa situação de vez','Ter paz e não pensar mais nisso'],prog:95}
];
var sel=[];
function progBar(p){document.getElementById('prog').style.width=p+'%';}
function render(){
  var tela=document.getElementById('tela');
  var i=S.etapa;
  if(i===0){
    progBar(5);
    tela.innerHTML='<div class="card"><div class="step-label">Análise gratuita</div><div class="step-title">Olá! Sou o assistente do Matias Valente.</div><div class="step-sub" style="margin-top:14px">Vou fazer uma análise gratuita da sua situação financeira com o que há de mais moderno em tecnologia, cruzando seus dados com padrões de comportamento identificados em milhares de situações reais.<br><br>Você não precisa se identificar em nenhum momento. Nenhum dado é vinculado ao seu nome real.<br><br>Isso é entre você e a análise. Leva menos de 2 minutos.</div><button class="btn btn-primary" onclick="av()">SIM, QUERO MINHA ANÁLISE</button></div><p class="rodape">Seus dados não são armazenados e sua identidade é preservada.</p>';
    return;
  }
  var p=perguntas[i-1];
  if(!p)return;
  progBar(p.prog);
  sel=Array.isArray(S[p.id])?S[p.id].slice():[];
  if(p.tipo==='texto'){
    tela.innerHTML='<div class="card"><div class="step-label">'+p.label+'</div><div class="step-title">'+p.titulo+'</div>'+(p.sub?'<div class="step-sub">'+p.sub+'</div>':'')+'<input type="text" id="inp" placeholder="Digite aqui ou deixe em branco" value="'+(S[p.id]||'')+'"><button class="btn btn-primary" onclick="salvarTexto()">Continuar</button></div>';
    setTimeout(function(){var el=document.getElementById('inp');if(el)el.focus();},100);
    return;
  }
  if(p.tipo==='unica'){
    var its='';
    for(var j=0;j<p.opcoes.length;j++){
      var op=p.opcoes[j];
      var on=S[p.id]===op?'on':'';
      its+='<div class="opcao" data-id="'+p.id+'" data-idx="'+j+'"><div class="check '+on+'"></div><span class="opcao-txt">'+op+'</span></div>';
    }
    tela.innerHTML='<div class="card"><div class="step-label">'+p.label+'</div><div class="step-title">'+p.titulo+'</div>'+(p.sub?'<div class="step-sub">'+p.sub+'</div>':'')+its+'</div>';
    tela.querySelectorAll('.opcao[data-id]').forEach(function(el){
      el.addEventListener('click',function(){escolherUnica(this.dataset.id,parseInt(this.dataset.idx));});
    });
    return;
  }
  if(p.tipo==='multipla'){
    var its='';
    for(var j=0;j<p.opcoes.length;j++){
      var op=p.opcoes[j];
      var on=sel.indexOf(op)>=0?'on':'';
      its+='<div class="opcao" data-idx="'+j+'"><div class="check '+on+'" id="ck'+j+'"></div><span class="opcao-txt">'+op+'</span></div>';
    }
    tela.innerHTML='<div class="card"><div class="step-label">'+p.label+'</div><div class="step-title">'+p.titulo+'</div>'+(p.sub?'<div class="step-sub">'+p.sub+'</div>':'')+its+'<button class="btn btn-primary" style="margin-top:18px" id="btn-confirmar">Confirmar escolhas</button></div>';
    tela.querySelectorAll('.opcao[data-idx]').forEach(function(el){
      el.addEventListener('click',function(){toggleSel(parseInt(this.dataset.idx));});
    });
    document.getElementById('btn-confirmar').addEventListener('click',function(){confirmarSel(p.id);});
    return;
  }
}
function av(){S.etapa++;render();}
function salvarTexto(){var v=document.getElementById('inp').value.trim();S[perguntas[S.etapa-1].id]=v;av();}
function escolherUnica(id,idx){S[id]=perguntas[S.etapa-1].opcoes[idx];av();}
function toggleSel(idx){
  var op=perguntas[S.etapa-1].opcoes[idx];
  var ck=document.getElementById('ck'+idx);
  var pos=sel.indexOf(op);
  if(pos>=0){sel.splice(pos,1);ck.classList.remove('on');}
  else{sel.push(op);ck.classList.add('on');}
}
function confirmarSel(id){
  if(sel.length===0){alert('Selecione ao menos uma opcao.');return;}
  S[id]=sel.slice();
  if(S.etapa>=perguntas.length){gerar();}else{av();}
}
async function gerar(){
  progBar(98);
  document.getElementById('tela').innerHTML='<div class="card loading" id="card-loading"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p style="font-size:15px;font-weight:600;color:#fff;margin-bottom:8px">Cruzando suas respostas...</p><p style="font-size:13px;color:#606090">Sua análise está sendo preparada. Isso leva alguns instantes.</p></div><div class="msg-card" id="card-msg1"><p>Análise Financeira é o caminho para solução. Não existe fórmula mágica, guru financeiro que oferece milagre ou planilha que resolva sozinha. O que existe é entender a sua real situação — e a maioria das pessoas nunca para para fazer uma análise eficiente.</p></div><div class="msg-card" id="card-msg2"><p>A análise que você vai receber não vai te julgar. Ela foi feita para mostrar o que está acontecendo — não para te culpar pelo que passou.<br><br><span style="color:#9b8bff;font-style:italic">Identificar e nomear o problema já é o primeiro alívio.</span></p></div>';
  setTimeout(function(){var m=document.getElementById('card-msg1');if(m)m.style.opacity='1';},6000);
  setTimeout(function(){var m=document.getElementById('card-msg2');if(m)m.style.opacity='1';},12000);
  var tipos=Array.isArray(S.tipos)?S.tipos.join(', '):S.tipos;
  var emocional=Array.isArray(S.emocional)?S.emocional.join(', '):S.emocional;
  var preocupacao=Array.isArray(S.preocupacao)?S.preocupacao.join(', '):S.preocupacao;
  var regras='REGRAS: Use apenas paragrafos simples separados por linha em branco. Linguagem simples direta e humana em portugues correto com acentuacao. Tom empatico encorajador e profissional. Nunca use linguagem agressiva. Nunca use metaforas informais. Nunca use a palavra simples. Nunca faca perguntas ao leitor pois a tela e estatica use sempre afirmações. Nunca termine com pergunta. Nunca afirme dívidas gerando juros se nao foi confirmado atraso. Nunca diga trabalha duro use com sua renda mensal. Nunca afirme inadimplencia se nao informada. SEMPRE use números ao mencionar valores ex R$3.000 nao escreva por extenso. Calcule media da faixa: R$2.000-R$4.000=R$3.000 R$4.000-R$7.000=R$5.500 R$7.000-R$10.000=R$8.500 R$10.000-R$15.000=R$12.500. Quando renda for Abaixo de R$2.000 use por volta de R$2.000. Nunca mencione prazos. Nunca numere niveis. Mencione suavemente gastos extras e imprevistos. Use gatilhos emocionais sutis identificacao pertencimento esperanca curiosidade. Transicoes sempre suaves. Sempre transmita que existe saida.';
  var estrutura='ESTRUTURA OBRIGATORIA em paragrafos corridos sem titulos sem numeracao sem labels: NUNCA escreva as palavras Acolhimento Perfil Analise Revelacao Fechamento ou qualquer titulo de parte no texto final. 1) Comece direto com 2-3 frases empaticas espelhando o que a pessoa sente baseado apenas no que informou sem julgamento. 2) Escreva Seu perfil financeiro e o de (escolha UM: Trabalhador Exausto, Apagador de Incendios, Parcelador, Sobrevivente, Quase Organizado ou Cuidador) e explique em 2 frases usando os dados informados tom de reconhecimento nao julgamento. 3) Maximo 3 frases: calcule quanto sobra apos o percentual comprometido usando a media da faixa diga que e o disponivel para todo o resto mencione suavemente que imprevistos tornam esse espaco menor. 4) Oriente de forma concreta e realizavel reconheca que nao e facil mas que e possivel nunca use a palavra simples nunca de prazo nunca diga inimigo nunca diga nao e para se assustar termine com afirmacao. 5) OBRIGATORIO: diga que existe um padrao especifico por tras do que esta acontecendo e que ele tem nome mas NAO revele qual e crie curiosidade genuina com leveza maximo 3 linhas use afirmacao como Quando voce entende esse padrao tudo muda de perspectiva. 6) Esperanca real ancorada no que a pessoa disse querer afirmacao suave sem preco sem pressao sem pergunta. NUNCA use o nome Matias Valente no meio do texto apenas na assinatura final.';
  var dados='DADOS: Renda='+S.renda+' Situacao='+S.situacao+' Total='+S.total+' Percentual='+S.percentual+' Tipos='+tipos+' Emocional='+emocional+' Preocupacao='+preocupacao+(S.nome?' Nome='+S.nome:'');
  var promptTexto='Você é o assistente do Matias Valente ex-gerente de banco com mais de 25 anos de experiencia. Gere um diagnostico financeiro personalizado. '+regras+' '+estrutura+' '+dados+' Assine como Matias Valente.';
  var payload=JSON.stringify({renda:S.renda,situacao:S.situacao,total:S.total,percentual:S.percentual,tipos:tipos,emocional:emocional,preocupacao:preocupacao,nome:S.nome,prompt:promptTexto});
  var esperarTempo=new Promise(function(resolve){setTimeout(resolve,35000);});
  var chamarAPI=fetch('https://matias-diagnostico.contato-matiasvalente.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});
  try{
    var resultados=await Promise.all([chamarAPI,esperarTempo]);
    var resposta=resultados[0];
    var dados_resp=await resposta.json();
    S.diagnostico=dados_resp.diagnostico||'Não foi possível gerar o diagnóstico.';
    exibir();
  }catch(e){
    document.getElementById('tela').innerHTML='<div class="card"><p style="color:#f87171;margin-bottom:16px">Erro ao gerar diagnóstico. Tente novamente.</p><button class="btn btn-primary" onclick="gerar()">Tentar novamente</button></div>';
  }
}

function exibir(){
  progBar(100);
  var saud=S.nome?S.nome+', sua análise está pronta':'Sua análise está pronta';
  var partes=S.diagnostico.split('\n\n').filter(function(p){return p.trim();});
  var txt=partes.map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
  var tela=document.getElementById('tela');
  tela.innerHTML='';
  var cardDiag=document.createElement('div');
  cardDiag.className='card';
  cardDiag.innerHTML='<div class="step-label">Análise exclusiva</div><div class="step-title" style="font-size:22px">'+saud+'</div><div style="margin-top:24px" class="diagnostico">'+txt+'</div>';
  tela.appendChild(cardDiag);
  var cardOferta=document.createElement('div');
  cardOferta.className='card';
  cardOferta.innerHTML='<div class="oferta-header"><div class="oferta-titulo">Existem dois caminhos para te ajudar a partir daqui</div><div class="oferta-desc">Você tem agora uma análise baseada em faixas de valores — um primeiro mapa da sua situação. Sem um estudo mais profundo com os números reais, fica difícil saber exatamente por onde começar.</div><div class="oferta-credencial">Com mais de 25 anos como gerente de banco, conheci centenas de perfis e comportamentos financeiros diferentes. Sei o que funciona — e o que só parece funcionar.</div><div class="oferta-desc" style="margin-top:16px;font-weight:500;color:#a0a0c0">Cada opção resolve uma dor diferente. Qual delas pode ser útil a você?</div></div><div class="opcao-card"><div class="opcao-card-titulo">Opção 1 — O caminho para sair do aperto financeiro</div><div class="opcao-card-sub">Para quem quer saber exatamente o que fazer — e em que ordem.</div><div class="check-item"><span class="check-icon">&#10003;</span>Análise exata da sua situação</div><div class="check-item"><span class="check-icon">&#10003;</span>Ordem exata de qual atacar primeiro</div><div class="check-item"><span class="check-icon">&#10003;</span>Próximos passos adaptados à sua realidade financeira</div><div class="check-item"><span class="check-icon">&#10003;</span>Ações imediatas específicas para o seu caso</div></div><div class="opcao-card destaque"><div class="opcao-card-badge">+ Mais completo</div><div class="opcao-card-titulo">Opção 2 — Para quem tenta sair do endividamento e não consegue</div><div class="opcao-card-sub">Ideal para organizar a vida financeira.</div><div class="check-item"><span class="check-icon">&#10003;</span>Tudo da Opção 1</div><div class="check-item"><span class="check-icon">&#10003;</span>Os motivos que mantêm no aperto financeiro</div><div class="check-item"><span class="check-icon">&#10003;</span>Mudanças específicas para o seu perfil</div><div class="check-item"><span class="check-icon">&#10003;</span>Guia prátic
