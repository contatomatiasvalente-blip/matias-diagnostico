<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Financeira — Matias Valente</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:0}
#app{max-width:580px;margin:0 auto;padding:32px 20px 60px}
.logo{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#c9a84a;font-weight:600;text-align:center;margin-bottom:8px}
.progress-wrap{height:3px;background:#1e1e35;border-radius:2px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:#8b7cf6;border-radius:2px;transition:width .4s ease}
.card{background:#14142a;border:1px solid #2a2a4a;border-radius:16px;padding:28px 24px;margin-bottom:16px}
.step-label{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#a79bef;font-weight:600;margin-bottom:10px}
.step-title{font-size:21px;font-weight:600;color:#fff;margin-bottom:6px;line-height:1.4}
.step-sub{font-size:15px;color:#c2bfe0;margin-bottom:18px;line-height:1.7}
.btn{display:block;width:100%;padding:17px 20px;border-radius:10px;font-size:16px;font-weight:600;text-align:center;cursor:pointer;border:none;margin-bottom:10px;transition:opacity .2s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:#8b7cf6;color:#fff}
.btn-primary:hover{background:#7a6be0}
.btn-outline{background:transparent;color:#b3a8ff;border:2px solid #8b7cf6}
.btn-outline:hover{background:#8b7cf620}
.btn-green{background:transparent;color:#4ade80;border:1px solid #4ade80;font-size:14px}
.btn-muted{background:transparent;color:#9b93c9;border:1px solid #2a2a4a;font-size:14px}
.opcao{display:flex;align-items:flex-start;gap:12px;padding:15px 0;border-bottom:1px solid #1e1e35;cursor:pointer;transition:opacity .15s}
.opcao:last-child{border-bottom:none}
.opcao:hover{opacity:.8}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #6f66a8;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.on{background:#8b7cf6;border-color:#8b7cf6}
.check.on::after{content:'';width:10px;height:10px;border-radius:50%;background:#fff}
.opcao-txt{font-size:16px;color:#ebe9fa;line-height:1.55}
.loading{text-align:center;padding:40px 20px}
.dots{display:inline-flex;gap:7px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;background:#8b7cf6;animation:pulse 1.3s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.diagnostico{font-size:16px;line-height:1.85;color:#e6e4fa;white-space:pre-wrap}
.transicao{font-size:15px;line-height:1.75;color:#d9c48a;font-style:italic;border-top:1px solid #2a2a4a;padding-top:18px;margin-top:20px}
.loading-msg{transition:opacity .4s ease;opacity:1}
.loading-msg.fade{opacity:0}
.divider{border:none;border-top:1px solid #2a2a4a;margin:20px 0}
.oferta-titulo{font-size:17px;font-weight:600;color:#fff;margin-bottom:6px}
.oferta-desc{font-size:14px;color:#c2bfe0;margin-bottom:16px;line-height:1.7}
.oferta-bloco{margin-bottom:16px}
.oferta-bloco-titulo{font-size:14px;font-weight:600;color:#d8d5f5;margin-bottom:8px}
.check-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:#b0aed6;margin-bottom:6px;line-height:1.5}
.check-item::before{content:'✓';color:#4ade80;flex-shrink:0;font-weight:600}
.rodape{font-size:12px;color:#6e6a95;text-align:center;margin-top:20px}
input[type=text]{width:100%;padding:14px;border-radius:8px;border:1px solid #2a2a4a;background:#0f0f1a;color:#e0e0f0;font-size:16px;font-family:inherit;margin-bottom:10px;outline:none}
input[type=text]:focus{border-color:#8b7cf6}
</style>
</head>
<body>
<div id="app">
  <div class="logo">Matias Valente</div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="tela"></div>
</div>

<script>
const S = {
  etapa: 0,
  nome: '', renda: '', situacao: '', total: '',
  percentual: '', tipos: [], emocional: [], preocupacao: '',
  diagnostico: ''
};

const perguntas = [
  { id:'nome', tipo:'texto', label:'Boas-vindas', titulo:'Como posso te chamar?', sub:'Pode ser nome, apelido ou deixar em branco. Opcional.', prog:10 },
  { id:'renda', tipo:'unica', label:'Pergunta 1 de 7', titulo:'Qual é sua renda mensal aproximada?', opcoes:['Abaixo de R$2.000','R$2.000 a R$4.000','R$4.000 a R$7.000','R$7.000 a R$10.000','R$10.000 a R$15.000','Acima de R$15.000'], prog:25 },
  { id:'emocional', tipo:'multipla', label:'Pergunta 2 de 7', titulo:'Qual dessas frases mais parece com a sua situação hoje?', sub:'Pode marcar mais de uma.', opcoes:['Trabalho muito e nunca sobra nada','Vivo apagando incêndios financeiros todo mês','O cartão de crédito virou um problema','Tenho medo de olhar minhas contas','Não sei por onde começar','Sinto que nunca vou conseguir sair disso'], prog:38 },
  { id:'situacao', tipo:'unica', label:'Pergunta 3 de 7', titulo:'Como está sua situação com dívidas em atraso?', opcoes:['Várias dívidas em atraso','Nome sujo, mas já parei de atrasar','Sem atraso, mas no limite todo mês','Sem atraso e com alguma folga'], prog:51 },
  { id:'total', tipo:'unica', label:'Pergunta 4 de 7', titulo:'Quanto você estima dever no total?', opcoes:['Devo até R$2.000','R$2.000 a R$10.000','R$10.000 a R$20.000','R$20.000 a R$30.000','Acima de R$30.000'], prog:64 },
  { id:'percentual', tipo:'unica', label:'Pergunta 5 de 7', titulo:'Quanto do seu salário já está comprometido com parcelas todo mês?', opcoes:['Menos de 15%','Entre 15% e 30%','Entre 30% e 50%','Entre 50% e 70%','Mais de 70%','Não sei calcular'], prog:77 },
  { id:'tipos', tipo:'multipla', label:'Pergunta 6 de 7', titulo:'Quais desses você tem em atraso ou pesando no orçamento hoje?', sub:'Pode marcar mais de uma.', opcoes:['Contas de consumo','Cartão de crédito','Cheque especial','Empréstimo pessoal (banco ou financeira)','Empréstimo com agiota ou pessoa física','Financiamento de veículo','Financiamento de imóvel','Aluguel','Mensalidade escolar ou faculdade','Nenhuma dessas — outra situação'], prog:88 },
  { id:'preocupacao', tipo:'multipla', label:'Pergunta 7 de 7', titulo:'O que mais te preocupa hoje?', sub:'Pode marcar mais de uma.', opcoes:['Limpar o nome','Parar de receber cobranças','Não conseguir pagar tudo que precisa','Não poder ajudar minha família','Nunca conseguir sair dessa situação de vez','Ter paz e não pensar mais nisso'], prog:95 }
];

let sel = [];

function prog(p){ document.getElementById('prog').style.width = p+'%'; }

function render(){
  const tela = document.getElementById('tela');
  const i = S.etapa;

  if(i === 0){
    prog(5);
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">Análise gratuita</div>
        <div class="step-title">Olá, vamos analisar juntos a sua situação agora.</div>
        <div class="step-sub" style="margin-top:12px">Você não precisa se identificar — isso é opcional, e nada do que você responder fica guardado.<br><br>Além da análise financeira, vou fazer uma leitura emocional e comportamental de como você tem lidado com o dinheiro no dia a dia: na maioria das vezes, a culpa não é da pessoa, são hábitos não percebidos que se repetem e levam ao aperto financeiro.<br><br>Não sou guru, nem vendedor de curso. Trabalhei por mais de 25 anos em instituições financeiras, sempre em atendimento direto a clientes, vendo de perto esse tipo de situação em pessoas de baixa e de alta renda.<br><br>Leva menos de 2 minutos. São perguntas objetivas.</div>
        <button class="btn btn-primary" onclick="av()">✅ Sim, quero minha análise</button>
      </div>
      <p class="rodape">Seus dados não são armazenados.</p>`;
    return;
  }

  const p = perguntas[i-1];
  if(!p) return;
  prog(p.prog);
  sel = Array.isArray(S[p.id]) ? [...S[p.id]] : [];

  if(p.tipo === 'texto'){
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        <input type="text" id="inp" placeholder="Digite aqui ou deixe em branco" value="${S[p.id]||''}">
        <button class="btn btn-primary" onclick="salvarTexto()">Continuar</button>
      </div>`;
    setTimeout(()=>{ const el=document.getElementById('inp'); if(el) el.focus(); },100);
    return;
  }

  if(p.tipo === 'unica'){
    const its = p.opcoes.map(op=>`
      <div class="opcao" onclick="escolherUnica('${p.id}','${op}')">
        <div class="check ${S[p.id]===op?'on':''}"></div>
        <span class="opcao-txt">${op}</span>
      </div>`).join('');
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        ${its}
      </div>`;
    return;
  }

  if(p.tipo === 'multipla'){
    const its = p.opcoes.map((op,idx)=>`
      <div class="opcao" onclick="toggleSel('${op}',${idx})">
        <div class="check ${sel.includes(op)?'on':''}" id="ck${idx}"></div>
        <span class="opcao-txt">${op}</span>
      </div>`).join('');
    tela.innerHTML = `
      <div class="card">
        <div class="step-label">${p.label}</div>
        <div class="step-title">${p.titulo}</div>
        ${p.sub ? `<div class="step-sub">${p.sub}</div>` : ''}
        ${its}
        <button class="btn btn-primary" style="margin-top:16px" onclick="confirmarSel('${p.id}')">Confirmar</button>
      </div>`;
    return;
  }
}

function av(){ S.etapa++; render(); }

function salvarTexto(){
  const v = document.getElementById('inp').value.trim();
  S[perguntas[S.etapa-1].id] = v;
  av();
}

function escolherUnica(id, val){
  S[id] = val;
  av();
}

function toggleSel(val, idx){
  const ck = document.getElementById('ck'+idx);
  if(sel.includes(val)){
    sel = sel.filter(v=>v!==val);
    ck.classList.remove('on');
  } else {
    sel.push(val);
    ck.classList.add('on');
  }
}

function confirmarSel(id){
  if(sel.length===0){ alert('Selecione ao menos uma opção.'); return; }
  S[id] = [...sel];
  if(S.etapa >= perguntas.length){ gerar(); } else { av(); }
}

async function gerar(){
  prog(98);
  document.getElementById('tela').innerHTML = `
    <div class="card loading">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <p id="msgLoading" class="loading-msg" style="font-size:15px;font-weight:500;color:#fff;margin-bottom:8px">Cruzando suas respostas...</p>
      <p style="font-size:13px;color:#8080b0">Sua análise está sendo preparada. Isso leva alguns instantes.</p>
    </div>`;

  const mensagens = [
    'Análise Financeira é o caminho para solução. Não existe fórmula mágica, guru financeiro que oferece milagre ou planilha que resolva sozinha. O que existe é entender a sua real situação — e a maioria das pessoas nunca para para fazer uma análise eficiente.',
    'A análise que você vai receber não vai te julgar. Ela foi feita para mostrar o que está acontecendo — não para te culpar pelo que passou. Identificar e nomear o problema já é o primeiro alívio.'
  ];

  function trocarMsg(texto){
    const el = document.getElementById('msgLoading');
    if(!el) return;
    el.classList.add('fade');
    setTimeout(() => {
      const el2 = document.getElementById('msgLoading');
      if(!el2) return;
      el2.textContent = texto;
      el2.classList.remove('fade');
    }, 400);
  }

  const t1 = setTimeout(() => trocarMsg(mensagens[0]), 15000);
  const t2 = setTimeout(() => trocarMsg(mensagens[1]), 30000);

  try {
    const r = await fetch('https://matias-diagnostico.contato-matiasvalente.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome: S.nome,
        renda: S.renda,
        situacao: S.situacao,
        total: S.total,
        percentual: S.percentual,
        tipos: Array.isArray(S.tipos) ? S.tipos.join(', ') : S.tipos,
        emocional: Array.isArray(S.emocional) ? S.emocional.join(', ') : S.emocional,
        preocupacao: Array.isArray(S.preocupacao) ? S.preocupacao.join(', ') : S.preocupacao
      })
    });
    const d = await r.json();
    S.diagnostico = d.diagnostico || 'Não foi possível gerar o diagnóstico.';
    clearTimeout(t1);
    clearTimeout(t2);
    exibir();
  } catch(e){
    clearTimeout(t1);
    clearTimeout(t2);
    document.getElementById('tela').innerHTML = `<div class="card"><p style="color:#f87171;margin-bottom:16px">Erro ao gerar diagnóstico.</p><button class="btn btn-primary" onclick="gerar()">Tentar novamente</button></div>`;
  }
}

function exibir(){
  prog(100);
  const saud = S.nome ? S.nome+', sua análise está pronta' : 'Sua análise está pronta';
  document.getElementById('tela').innerHTML = `
    <div class="card">
      <div class="step-label">Análise exclusiva — simplificada</div>
      <div class="step-title">${saud}</div>
      <div style="margin-top:16px" class="diagnostico">${S.diagnostico}</div>
      <div class="transicao">O que você acabou de ler é verdadeiro, mas é só a superfície. Os números reais da sua situação, o motivo específico por trás desse padrão, e o que fazer com isso a partir de agora pedem um detalhamento melhor dos seus gastos e do seu comportamento. Posso te entregar uma análise completa, com um diagnóstico comportamental que pode te dar direção para organizar sua vida financeira.</div>
    </div>

    <div class="card">
      <div class="oferta-titulo">Existem dois caminhos a partir daqui</div>
      <div class="oferta-desc">A diferença não é o tamanho — é a dor que cada um resolve.</div>

      <div class="oferta-bloco">
        <div class="oferta-bloco-titulo">Opção 1 — O caminho para sair</div>
        <div class="check-item">Valor real de cada dívida, não faixas</div>
        <div class="check-item">Ordem exata de qual atacar primeiro</div>
        <div class="check-item">Estimativa de tempo com sua renda real</div>
        <div class="check-item">Uma ação imediata específica para o seu caso</div>
      </div>

      <div class="divider"></div>

      <div class="oferta-bloco">
        <div class="oferta-bloco-titulo">Opção 2 — Por que esse caminho se repetiu</div>
        <div class="check-item">Tudo da Opção 1</div>
        <div class="check-item">O padrão que mantém a situação se repetindo</div>
        <div class="check-item">3 mudanças específicas para o seu perfil</div>
        <div class="check-item">Guia prático + mensagem final personalizada</div>
      </div>

      <button class="btn btn-primary" onclick="window.open('https://pay.kiwify.com.br/aGEzNaU','_blank')">Quero entender o caminho para sair</button>
      <button class="btn btn-outline" onclick="window.open('https://pay.kiwify.com.br/t5H3kAi','_blank')">Quero entender por que se repetiu</button>
      <button class="btn btn-green" onclick="salvarWA()">📱 Salvar análise no WhatsApp</button>
      <button class="btn btn-muted" onclick="fechar()">Agora não</button>
    </div>

    <p class="rodape">Seus dados não são armazenados. Análise gerada de forma anônima.</p>`;
}

function salvarWA(){
  window.open('https://wa.me/?text='+encodeURIComponent('Minha análise — Matias Valente:\n\n'+S.diagnostico),'_blank');
}

function fechar(){
  const cards = document.querySelectorAll('.card');
  const last = cards[cards.length-1];
  last.innerHTML = `
    <p style="font-size:15px;font-weight:500;color:#fff;margin-bottom:8px">Tudo bem — a análise fica aqui quando você estiver pronto.</p>
    <p style="font-size:13px;color:#8080b0;line-height:1.6">O canal do Matias Valente continua te ajudando de graça. Toda semana tem vídeo novo sobre exatamente o que você está passando.</p>
    <p style="font-size:13px;color:#8b7cf6;margin-top:12px">— Matias Valente</p>`;
}

render();
</script>
</body>
</html>
